<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380" style="background:#090d16;border-radius:14px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4" />
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.04); }
      }
      @keyframes beamMove {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes particleFloat {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-8px) translateX(4px); }
      }
      @keyframes orbitSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .pulse-bg {
        transform-origin: 600px 190px;
        animation: pulseGlow 6s ease-in-out infinite;
      }
      .laser-stream {
        stroke-dasharray: 20, 20;
        animation: beamMove 4s linear infinite;
      }
      .laser-stream-rev {
        stroke-dasharray: 15, 15;
        animation: beamMove 3s linear infinite reverse;
      }
      .floating-particle {
        animation: particleFloat 5s ease-in-out infinite;
      }
      .floating-particle-delayed {
        animation: particleFloat 6s ease-in-out 2s infinite;
      }
      .rotating-ring {
        transform-origin: 600px 75px;
        animation: orbitSlow 25s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" fill="url(#bgGrad)" />

  <!-- Grid Layer -->
  <rect width="1200" height="380" fill="url(#grid)" />

  <!-- Ambient Dynamic Glows (Behind all content) -->
  <g class="pulse-bg">
    <circle cx="600" cy="120" r="180" fill="#6366f1" opacity="0.12" filter="url(#glow)" />
    <circle cx="200" cy="90" r="130" fill="#0284c7" opacity="0.1" filter="url(#glow)" />
    <circle cx="1000" cy="140" r="150" fill="#a855f7" opacity="0.1" filter="url(#glow)" />
  </g>

  <!-- Dynamic Data Stream Circuit Lines (Midground) -->
  <g opacity="0.6">
    <!-- Red raw data arriving from left -->
    <path d="M 80 180 L 260 180 L 320 120 L 480 120" fill="none" stroke="#f43f5e" stroke-width="2" stroke-opacity="0.4" />
    <path d="M 80 180 L 260 180 L 320 120 L 480 120" fill="none" stroke="#f43f5e" stroke-width="2.5" class="laser-stream" filter="url(#softGlow)" />

    <path d="M 120 220 L 300 220 L 360 150 L 490 150" fill="none" stroke="#fb923c" stroke-width="1.8" stroke-opacity="0.35" />
    <path d="M 120 220 L 300 220 L 360 150 L 490 150" fill="none" stroke="#fb923c" stroke-width="2" class="laser-stream-rev" />

    <!-- Protected data flowing out to right -->
    <path d="M 720 120 L 880 120 L 940 180 L 1120 180" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.4" />
    <path d="M 720 120 L 880 120 L 940 180 L 1120 180" fill="none" stroke="#10b981" stroke-width="2.5" class="laser-stream" filter="url(#softGlow)" />

    <path d="M 710 150 L 840 150 L 900 220 L 1080 220" fill="none" stroke="#06b6d4" stroke-width="1.8" stroke-opacity="0.35" />
    <path d="M 710 150 L 840 150 L 900 220 L 1080 220" fill="none" stroke="#06b6d4" stroke-width="2" class="laser-stream-rev" />
  </g>

  <!-- Ambient Floating Data Particles (Midground) -->
  <g class="floating-particle">
    <circle cx="280" cy="140" r="3" fill="#38bdf8" opacity="0.7" filter="url(#softGlow)" />
    <circle cx="920" cy="140" r="3.5" fill="#34d399" opacity="0.8" filter="url(#softGlow)" />
    <circle cx="440" cy="80" r="2.5" fill="#818cf8" opacity="0.6" />
    <circle cx="760" cy="90" r="3" fill="#c084fc" opacity="0.6" />
  </g>
  <g class="floating-particle-delayed">
    <circle cx="340" cy="240" r="2.5" fill="#f43f5e" opacity="0.5" />
    <circle cx="860" cy="240" r="3" fill="#10b981" opacity="0.7" />
  </g>

  <!-- Center Shield Icon Group (Foreground / Clean Vector) -->
  <g transform="translate(600, 68)">
    <!-- Rotating subtle ring behind shield -->
    <circle cx="0" cy="0" r="36" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-dasharray="6, 6" opacity="0.4" class="rotating-ring" />
    
    <!-- Shield Base -->
    <path d="M 0 -28 L 24 -16 C 24 10 14 26 0 34 C -14 26 -24 10 -24 -16 Z" fill="url(#shieldGrad)" filter="url(#softGlow)" />
    <!-- Lock symbol inside shield -->
    <path d="M -7 -4 L -7 -9 C -7 -13 -3 -16 0 -16 C 3 -16 7 -13 7 -9 L 7 -4 L 9 -4 C 10.5 -4 11.5 -3 11.5 -1.5 L 11.5 9 C 11.5 10.5 10.5 11.5 9 11.5 L -9 11.5 C -10.5 11.5 -11.5 10.5 -11.5 9 L -11.5 -1.5 C -11.5 -3 -10.5 -4 -9 -4 Z M -4 -4 L 4 -4 L 4 -9 C 4 -11.2 2.2 -13 0 -13 C -2.2 -13 -4 -11.2 -4 -9 Z" fill="#ffffff" opacity="0.95" />
    <!-- Keyhole -->
    <circle cx="0" cy="2" r="1.8" fill="#4338ca" />
    <rect x="-1" y="2" width="2" height="4" fill="#4338ca" />
  </g>

  <!-- FOREGROUND TEXT (High contrast, guaranteed readable, never obscured) -->
  <!-- Category Tag -->
  <g transform="translate(600, 132)">
    <rect x="-140" y="-12" width="280" height="24" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" stroke-opacity="0.6" />
    <text text-anchor="middle" y="4" font-size="11" font-weight="700" fill="#a5b4fc" letter-spacing="2">AUTOMATED PRIVACY &amp; COMPLIANCE</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="190" text-anchor="middle" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
    Awesome Automated Privacy Policy Enforcers
  </text>

  <!-- Subtitle -->
  <text x="600" y="226" text-anchor="middle" font-size="15.5" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
    Curated Hub for PII Redaction, Token-Level Consent &amp; Data Access Governance
  </text>

  <!-- Feature Pills Row (Foreground) -->
  <g transform="translate(600, 276)">
    <!-- Pill 1: PII Redaction -->
    <g transform="translate(-360, 0)">
      <rect x="-85" y="-15" width="170" height="30" rx="15" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />
      <text text-anchor="middle" y="5" font-size="12" font-weight="600" fill="#e0f2fe">🔒 PII Masking &amp; Redaction</text>
    </g>

    <!-- Pill 2: Consent Enforcement -->
    <g transform="translate(-120, 0)">
      <rect x="-85" y="-15" width="170" height="30" rx="15" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.7" />
      <text text-anchor="middle" y="5" font-size="12" font-weight="600" fill="#e0e7ff">⚖️ Consent Enforcement</text>
    </g>

    <!-- Pill 3: DSPM & Access -->
    <g transform="translate(120, 0)">
      <rect x="-85" y="-15" width="170" height="30" rx="15" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.7" />
      <text text-anchor="middle" y="5" font-size="12" font-weight="600" fill="#f3e8ff">🛡️ DSPM &amp; Access Control</text>
    </g>

    <!-- Pill 4: AI Guardrails -->
    <g transform="translate(360, 0)">
      <rect x="-85" y="-15" width="170" height="30" rx="15" fill="#0f172a" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.7" />
      <text text-anchor="middle" y="5" font-size="12" font-weight="600" fill="#d1fae5">🤖 AI Guardrails &amp; LLMs</text>
    </g>
  </g>

  <!-- Bottom Stats / Tech Stack Bar -->
  <g transform="translate(600, 340)">
    <text text-anchor="middle" font-size="12" font-weight="500" fill="#64748b" letter-spacing="0.5">
      GDPR • CCPA/CPRA • EU AI ACT • HIPAA • PRIVACY-AS-CODE • ZERO-TRUST ARCHITECTURES
    </text>
  </g>
</svg>
